name: Build Jordan Mind

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-android:
    name: Tests and signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify the Android SDK is available
        # The runner image already ships an Android SDK. The setup-android action is deliberately
        # not used: its bundled sdkmanager rejects the legacy 'tools' package and fails the job.
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" | tail -3
          ls "$ANDROID_HOME/build-tools" | tail -3

      - name: Unit tests (shared core, planner, agent, UI smoke)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Restore the release keystore
        # Prefer a keystore supplied through secrets so the signing identity is stable across
        # builds. Without one, generate a throwaway so the artifact is still installable.
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
            echo "Using the keystore from secrets."
          else
            echo "No RELEASE_KEYSTORE_BASE64 secret set; generating a throwaway keystore."
            keytool -genkeypair -v -keystore keystore/release.jks -alias jordanmind \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass jordanmind -keypass jordanmind \
              -dname "CN=Jordan Mind, OU=Offline Agent, O=Jordan Mind, L=Nairobi, C=KE"
          fi

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: ${{ github.workspace }}/keystore/release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'jordanmind' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'jordanmind' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'jordanmind' }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify the APK is signed and declares no network permission
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "APK: $APK"
          BT=$(ls -d $ANDROID_HOME/build-tools/* | tail -1)
          "$BT/apksigner" verify --print-certs "$APK"
          BADGING=$("$BT/aapt2" dump badging "$APK")
          echo "$BADGING" | grep -q "launchable-activity" || { echo "not launchable"; exit 1; }
          if echo "$BADGING" | grep -q "android.permission.INTERNET"; then
            echo "INTERNET permission present - the offline guarantee is broken"; exit 1
          fi
          echo "No network permission declared."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JordanMind-android-apk
          path: app/build/outputs/apk/release/*.apk

  build-windows-exe:
    name: Windows installer
    # A Windows .exe cannot be produced from Linux: jpackage links a native launcher and a
    # Windows runtime image. This job is the supported way to produce the deliverable.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Desktop tests
        run: ./gradlew :core:test :desktop:test --no-daemon
        shell: bash

      - name: Package Windows .exe and .msi
        run: ./gradlew :desktop:packageReleaseExe :desktop:packageReleaseMsi --no-daemon
        shell: bash

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: JordanMind-windows
          path: |
            desktop/build/compose/binaries/main-release/exe/*.exe
            desktop/build/compose/binaries/main-release/msi/*.msi
          if-no-files-found: error

  build-linux-desktop:
    name: Linux desktop packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Package .deb and a runnable app image
        run: ./gradlew :desktop:packageReleaseDeb :desktop:createReleaseDistributable --no-daemon

      - name: Smoke test that the packaged app actually starts
        # Proves the distribution launches rather than merely compiling.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          APP=$(find desktop/build/compose/binaries/main-release/app -name 'Jordan Mind' -type f | head -1)
          echo "App: $APP"
          xvfb-run -a "$APP" &
          sleep 25
          pgrep -f "Jordan Mind" >/dev/null && echo "Desktop app is running." || { echo "App did not start"; exit 1; }
          pkill -f "Jordan Mind" || true

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: JordanMind-linux
          path: |
            desktop/build/compose/binaries/main-release/deb/*.deb
            desktop/build/compose/binaries/main-release/app/**
